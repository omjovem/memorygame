<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo da memória</title>
<style>
  :root{
    --table:#B0B04B; --sky-yellow:#FFDB00; --sky-blue:#003E70;
    --glow-blue:#1E6FD9; --glow-orange:#FF5400; --glow-yellow:#FFDB00; --glow-black:#000000;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --table:#B0B04B; } }
  :root[data-theme="dark"]{ --table:#B0B04B; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  html,body{ height:100%; margin:0; }
  body{ background:var(--table); overflow:hidden; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }

  #frame{ position:relative; overflow:hidden; }
  #stage{ position:absolute; left:0; top:0; width:6144px; height:4068px; transform-origin:0 0; overflow:hidden; background:var(--sky-yellow); }
  #stage img{ display:block; user-select:none; -webkit-user-drag:none; pointer-events:none; }

  /* sky */
  .layer{ position:absolute; }
  #blue{ position:absolute; top:0; height:1400px; left:-12288px; width:12288px; background:var(--sky-blue);
         transform:translateX(-620px); transition:transform 1.5s cubic-bezier(.65,0,.3,1); }
  #blue img{ position:absolute; left:calc(100% - 12px); top:0; width:620px; height:1400px; }
  #sun{ left:5400px; top:150px; width:480px; height:490px; transition:opacity .9s ease; transform-origin:50% 50%; }
  #moon{ left:260px; top:240px; width:410px; height:350px; opacity:0; transition:opacity .9s ease .4s; }
  #stage.has-moon #moon{ opacity:1; }
  #stage.no-sun #sun{ opacity:0; }
  #stage.win #sun{ animation:sunPulse 1.6s ease-in-out infinite; }
  @keyframes sunPulse{ 0%,100%{ transform:scale(1) rotate(0deg); } 50%{ transform:scale(1.18) rotate(18deg); } }
  #table{ left:0; top:0; width:6144px; height:4068px; }
  #reset{ left:2850px; top:360px; width:440px; height:170px; opacity:0; transition:opacity .3s; }
  #stage.resetting #reset{ opacity:1; animation:blink .9s steps(2,jump-none) infinite; }
  @keyframes blink{ 0%{ opacity:1; } 100%{ opacity:.15; } }

  /* cards */
  .card{ position:absolute; left:0; top:0; width:611px; height:921px; padding:0; margin:0; border:0; background:none;
         cursor:pointer; perspective:3200px; transition:transform .6s cubic-bezier(.3,.7,.3,1); outline:none; will-change:transform; }
  .card:disabled{ cursor:default; }
  .card .glow{ position:absolute; left:-36px; top:-36px; width:683px; height:994px; background:#000;
         -webkit-mask:var(--glow-mask) center/100% 100% no-repeat; mask:var(--glow-mask) center/100% 100% no-repeat;
         opacity:.32; transform:translate(22px,26px); transition:opacity .5s, transform .5s; }
  .card .flip{ position:absolute; inset:0; transform-style:preserve-3d; }
  .card.up .flip{ transform:rotateY(180deg); }
  .card .face{ position:absolute; inset:0; width:100%; height:100%; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .card .front{ transform:rotateY(180deg); }
  .card:focus-visible .flip{ outline:24px solid var(--glow-orange); outline-offset:14px; border-radius:40px; }
  .card.hit .flip{ animation:hit .5s ease; }
  @keyframes hit{ 0%{ transform:rotateY(180deg) scale(1); } 45%{ transform:rotateY(180deg) scale(1.07); } 100%{ transform:rotateY(180deg) scale(1); } }
  .card.miss .flip{ animation:miss .45s ease; }
  @keyframes miss{ 0%,100%{ transform:rotateY(180deg) translateX(0); } 25%{ transform:rotateY(180deg) translateX(-30px); } 75%{ transform:rotateY(180deg) translateX(30px); } }

  #stage.win .card .glow{ transform:translate(0,0) scale(1.08); animation:glow 2s linear infinite; animation-delay:var(--d); }
  @keyframes glow{
    0%   { background:var(--glow-blue);   opacity:1; }
    12%  { background:var(--glow-blue);   opacity:.1; }
    25%  { background:var(--glow-orange); opacity:1; }
    37%  { background:var(--glow-orange); opacity:.1; }
    50%  { background:var(--glow-yellow); opacity:1; }
    62%  { background:var(--glow-yellow); opacity:.1; }
    75%  { background:var(--glow-black);  opacity:1; }
    87%  { background:var(--glow-black);  opacity:.1; }
    100% { background:var(--glow-blue);   opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .card, .card .flip, #blue{ transition-duration:.01s !important; }
    #stage.win .card .glow{ animation-duration:6s; }
    #stage.win #sun, #stage.resetting #reset{ animation:none; }
  }
</style>
</head>

    // opening fanfare: rising sparkle arpeggio (C major)
    [1047, 1319, 1568, 2093, 2637, 3136].forEach((f, i) => bell(t0 + i * .07, f, .16 - i * .012, (i / 5) * 1.2 - .6));
    bell(t0 + .45, 523.25, .14, 0, 2.2); bell(t0 + .45, 659.25, .1, 0, 2.2); bell(t0 + .45, 783.99, .1, 0, 2.2);
    // three rockets
    rocket(t0 + .35, -.5);
    rocket(t0 + 1.25, .55);
    rocket(t0 + 2.05, 0);
    // shimmer tail
    for (let i = 0; i < 14; i++) bell(t0 + 2.9 + i * .09 + R() * .04, [2093, 2349, 2637, 3136, 3520][(R() * 5) | 0], .04 * (1 - i / 14), (R() - .5) * 1.4, .8);
  }
  window.__celebrate = celebrate; // used for offline checks
  function playWin(){
    try { unlockAudio(); if (actx) celebrate(actx, actx.currentTime + .05); } catch (e) {}
  }

  async function win(){
    playWin();
    setSky(0);
    stage.classList.add('win');
    await wait(7000);
    stage.classList.remove('win');
    await wait(400);
    await reset(true);
  }

  async function gather(){
    cards.forEach(c => { if (c.up) setUp(c, false); c.el.classList.remove('hit'); });
    await wait(cards.some(c => c.matched) ? 620 : 50);
    const order = shuffle([...cards]);
    order.forEach((c, i) => {
      c.el.style.zIndex = i + 1;
      setTimeout(() => place(c, PILE.x + rnd(-24, 24), PILE.y - i * 6 + rnd(-10, 10), rnd(-7, 7), 0.55), reduce ? 0 : i * 45);
    });
    await wait(order.length * 45 + 620);
  }

  async function riffle(times){
    for (let t = 0; t < times; t++){
      const deck = [...cards].sort((a, b) => a.el.style.zIndex - b.el.style.zIndex);
      const L = deck.filter((_, i) => i % 2 === 0), R = deck.filter((_, i) => i % 2 === 1);
      L.forEach((c, i) => place(c, PILE.x - 470 + rnd(-20, 20), PILE.y - i * 6, -14 + rnd(-3, 3), 0.32));
      R.forEach((c, i) => place(c, PILE.x + 470 + rnd(-20, 20), PILE.y - i * 6, 14 + rnd(-3, 3), 0.32));
      await wait(360);
      const merged = shuffle(deck);
      merged.forEach((c, i) => {
        c.el.style.zIndex = i + 1;
        setTimeout(() => place(c, PILE.x + rnd(-18, 18), PILE.y - i * 6, rnd(-6, 6), 0.26), reduce ? 0 : i * 28);
      });
      await wait(merged.length * 28 + 300);
    }
  }

  async function deal(){
    const faces = newLayout();
    const deck = [...cards].sort((a, b) => b.el.style.zIndex - a.el.style.zIndex); // top of pile first
    const slotOf = shuffle([...Array(12).keys()]); // deal order around the table changes every round
    deck.forEach((c, i) => {
      const k = slotOf[i];
      c.face = faces[k]; c.front.src = FACES[c.face]; c.matched = false;
      const s = SLOTS[k];
      setTimeout(() => {
        c.el.style.zIndex = 20 + i;
        place(c, s[0] + rnd(-55, 55), s[1] + rnd(-45, 45), s[2] + rnd(-5, 5), 0.6);
      }, reduce ? 0 : i * 110);
    });
    await wait(deck.length * 110 + 650);
    matchedCount = 0; open = [];
  }

  async function reset(fromWin){
    lock(true);
    if (!fromWin) setSky(1);
    stage.classList.add('resetting');
    await wait(500);
    await gather();
    await riffle(3);
    await deal();
    stage.classList.remove('resetting');
    errors = 0; setSky(0);
    lock(false);
  }

  async function start(){
    const imgs = [...document.images, ...FACES.map(src => Object.assign(new Image(), { src }))];
    await Promise.all(imgs.map(im => im.decode ? im.decode().catch(() => {}) : null));
    cards.forEach((c, i) => { c.el.style.zIndex = i + 1; place(c, PILE.x + rnd(-20, 20), PILE.y - i * 6, rnd(-6, 6), 0.01); });
    setSky(0);
    await wait(500);
    await riffle(2);
    await deal();
    lock(false);
  }
  start();
})();
</script>
